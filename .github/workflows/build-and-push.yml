name: Build Docker Image

on:
    push:
        branches: [master]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    packages: write
    pull-requests: read

env:
    REGISTRY: ghcr.io
    REGISTRY_IMAGE_NAME: ghcr.io/${{ github.repository }}
    # Master writes the shared buildcache-<variant>-<arch> ref. Same-repo PRs write their own
    # buildcache-pr-<number>-* ref, which the master build after the merge also reads.
    # Fork PRs get a read-only token, so they only read the cache.
    WRITE_CACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    GH_TOKEN: ${{ github.token }}

jobs:
    build-and-push-amd64:
        strategy:
            fail-fast: false
            matrix:
                phpversion:
#                    - '8.4'
                    - '8.5'
                    - '8.5-frankenphp'
                    - '8.5-www'
                    - '8.6'
                    - '8.6-frankenphp'
                    - '8.6-www'
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Login to GHCR
              if: env.WRITE_CACHE == 'true'
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and test Docker Image
              env:
                  IMAGE: ${{ env.REGISTRY_IMAGE_NAME }}:${{ matrix.phpversion }}-amd64
                  CACHE: ${{ env.REGISTRY_IMAGE_NAME }}:buildcache-${{ matrix.phpversion }}-amd64
              run: |
                  docker buildx create --use --driver docker-container
                  pr="${{ github.event.pull_request.number }}"
                  if [ -z "$pr" ]; then
                    # On master, find the PR this commit was merged from to reuse its cache.
                    pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq "map(select(.merge_commit_sha == \"$GITHUB_SHA\"))[0].number // empty" 2>/dev/null || true)
                  fi
                  pr_cache="${CACHE/buildcache-/buildcache-pr-$pr-}"
                  cache_args=(--cache-from "type=registry,ref=$CACHE")
                  if [ -n "$pr" ]; then
                    cache_args+=(--cache-from "type=registry,ref=$pr_cache")
                  fi
                  if [ "$WRITE_CACHE" = true ]; then
                    cache_ref="$CACHE"
                    if [ "${{ github.event_name }}" = "pull_request" ]; then
                      cache_ref="$pr_cache"
                    fi
                    # A refused cache upload (e.g. Dependabot's read-only token) must not fail the build.
                    cache_args+=(--cache-to "type=registry,ref=$cache_ref,mode=max,ignore-error=true")
                  fi
                  docker buildx build --load \
                    --provenance=false \
                    "${cache_args[@]}" \
                    -f ${{ matrix.phpversion }}/Dockerfile \
                    -t "$IMAGE" .
                  sh scripts/test-image.sh "$IMAGE" "${{ matrix.phpversion }}"
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                    docker push "$IMAGE"
                  fi

    build-and-push-arm64:
        strategy:
            fail-fast: false
            matrix:
                phpversion:
#                    - '8.4'
                    - '8.5'
                    - '8.5-frankenphp'
                    - '8.5-www'
                    - '8.6'
                    - '8.6-frankenphp'
                    - '8.6-www'
        runs-on: blacksmith-4vcpu-ubuntu-2404-arm
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Login to GHCR
              if: env.WRITE_CACHE == 'true'
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and test Docker Image
              env:
                  IMAGE: ${{ env.REGISTRY_IMAGE_NAME }}:${{ matrix.phpversion }}-arm64
                  CACHE: ${{ env.REGISTRY_IMAGE_NAME }}:buildcache-${{ matrix.phpversion }}-arm64
              run: |
                  docker buildx create --use --driver docker-container
                  pr="${{ github.event.pull_request.number }}"
                  if [ -z "$pr" ]; then
                    # On master, find the PR this commit was merged from to reuse its cache.
                    pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq "map(select(.merge_commit_sha == \"$GITHUB_SHA\"))[0].number // empty" 2>/dev/null || true)
                  fi
                  pr_cache="${CACHE/buildcache-/buildcache-pr-$pr-}"
                  cache_args=(--cache-from "type=registry,ref=$CACHE")
                  if [ -n "$pr" ]; then
                    cache_args+=(--cache-from "type=registry,ref=$pr_cache")
                  fi
                  if [ "$WRITE_CACHE" = true ]; then
                    cache_ref="$CACHE"
                    if [ "${{ github.event_name }}" = "pull_request" ]; then
                      cache_ref="$pr_cache"
                    fi
                    # A refused cache upload (e.g. Dependabot's read-only token) must not fail the build.
                    cache_args+=(--cache-to "type=registry,ref=$cache_ref,mode=max,ignore-error=true")
                  fi
                  docker buildx build --load \
                    --provenance=false \
                    "${cache_args[@]}" \
                    -f ${{ matrix.phpversion }}/Dockerfile \
                    -t "$IMAGE" .
                  sh scripts/test-image.sh "$IMAGE" "${{ matrix.phpversion }}"
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                    docker push "$IMAGE"
                  fi

    create-multiarch-manifests:
        if: ${{ success() && github.event_name != 'pull_request' }}
        needs: [build-and-push-amd64, build-and-push-arm64]
        strategy:
            fail-fast: false
            matrix:
                phpversion:
#                    - '8.4'
                    - '8.5'
                    - '8.5-frankenphp'
                    - '8.5-www'
                    - '8.6'
                    - '8.6-frankenphp'
                    - '8.6-www'
        runs-on: blacksmith-2vcpu-ubuntu-2404
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Login to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Check if arch images exist
                id: check-images
                run: |
                    AMD64_EXISTS=false
                    ARM64_EXISTS=false
                    if docker manifest inspect ${{ env.REGISTRY_IMAGE_NAME }}:${{ matrix.phpversion }}-amd64 > /dev/null 2>&1; then
                      AMD64_EXISTS=true
                    fi
                    if docker manifest inspect ${{ env.REGISTRY_IMAGE_NAME }}:${{ matrix.phpversion }}-arm64 > /dev/null 2>&1; then
                      ARM64_EXISTS=true
                    fi
                    echo "amd64=$AMD64_EXISTS" >> "$GITHUB_OUTPUT"
                    echo "arm64=$ARM64_EXISTS" >> "$GITHUB_OUTPUT"

            -   name: Create ${{ matrix.phpversion }} manifest and push
                if: steps.check-images.outputs.amd64 == 'true' && steps.check-images.outputs.arm64 == 'true'
                run: |
                    docker manifest create \
                      ${{ env.REGISTRY_IMAGE_NAME }}:${{ matrix.phpversion }} \
                      --amend ${{ env.REGISTRY_IMAGE_NAME }}:${{ matrix.phpversion }}-amd64 \
                      --amend ${{ env.REGISTRY_IMAGE_NAME }}:${{ matrix.phpversion }}-arm64
                    docker manifest push ${{ env.REGISTRY_IMAGE_NAME }}:${{ matrix.phpversion }}
