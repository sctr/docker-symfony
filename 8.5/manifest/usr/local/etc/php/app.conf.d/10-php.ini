[PHP]
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = -1
max_execution_time = 30
max_input_time = 30
expose_php = Off
date.timezone = UTC
session_use_strict_mode = 1
session.auto_start = Off
short_open_tag = Off
zend_detect_unicode = Off
; CVE-2026-109618: upload progress writes a session from any multipart request, before the app runs
session.upload_progress.enabled = 0
