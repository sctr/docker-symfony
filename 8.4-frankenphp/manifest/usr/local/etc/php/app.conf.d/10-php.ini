[PHP]
error_reporting = E_ALL
display_errors = Off
log_errors = On
memory_limit = -1
max_execution_time = 30
max_input_time = 30
expose_php = 0
date.timezone = UTC
session_use_strict_mode = 1
session.auto_start = Off
short_open_tag = Off
zend.detect_unicode = 0
; CVE-2026-109619: upload progress writes a session from any multipart request, before the app runs
session.upload_progress.enabled = 0
